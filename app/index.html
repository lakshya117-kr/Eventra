<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZK Ticket Booking — Decentralized event ticketing with zero-knowledge proof verification on Solana" />
    <title>ZKTicket — Solana Event Ticketing</title>

  <body>
    <div id="root"></div>
    <script type="module">
      // Import Buffer from the SINGLE npm buffer@6 package and set it globally
      // BEFORE the app loads. This is the same module that safe-buffer and
      // base-x will use (via resolve.alias), ensuring ONE Buffer prototype.
      import { Buffer } from 'buffer';
      globalThis.Buffer = Buffer;
      globalThis.global = globalThis;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
